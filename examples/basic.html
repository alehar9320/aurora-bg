<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aurora BG — Basic Example</title>
  <style>
    body { margin: 0; background: #0a0a1a; height: 100vh; font-family: system-ui, sans-serif; }
    .container { display: flex; gap: 10px; padding: 20px; height: 100vh; box-sizing: border-box; }
    .card {
      flex: 1; border-radius: 12px; overflow: hidden; position: relative;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    .card label {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      color: rgba(255,255,255,0.6); font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .card aurora-bg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <label>Default Colors</label>
      <aurora-bg density="0.5" speed="0.6"></aurora-bg>
    </div>
    <div class="card">
      <label>Warm Palette</label>
      <aurora-bg colors="#ff6b6b,#ffd93d,#ff8a5c" density="0.7" interactive></aurora-bg>
    </div>
    <div class="card">
      <label>Cool Palette</label>
      <aurora-bg colors="#00d2ff,#3a7bd5,#00ff88" density="0.9" speed="1.2"></aurora-bg>
    </div>
  </div>
  <script src="../dist/aurora.umd.js"></script>
  <script>auroraBg.defineAuroraBg()</script>
</body>
</html>
