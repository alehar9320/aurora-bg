  <!-- Aurora curtain 1 (green) — wavy band -->
  <path d="M-20,80 C80,50 150,120 200,95 C250,70 300,130 360,100 C420,70 470,130 530,105 C590,80 640,120 740,90"
        fill="none" stroke="url(#aurora1)" stroke-width="60" stroke-linecap="round" opacity="0.8" />

  <!-- Aurora curtain 2 (cyan) — second wave offset -->
  <path d="M-20,130 C100,95 180,160 240,130 C300,100 360,170 420,140 C480,110 540,165 600,135 C660,105 700,150 740,120"
        fill="none" stroke="url(#aurora2)" stroke-width="50" stroke-linecap="round" opacity="0.7" />

  <!-- Aurora curtain 3 (blue) — subtle wave -->
  <path d="M-20,170 C90,145 170,200 230,175 C290,150 350,210 410,185 C470,160 530,205 600,175 C660,145 700,190 740,165"
        fill="none" stroke="url(#aurora3)" stroke-width="45" stroke-linecap="round" opacity="0.6" />

  <!-- Aurora curtain 4 (magenta) — faint accent -->
  <path d="M-20,210 C110,185 200,235 270,205 C340,175 400,240 460,215 C520,190 570,235 640,210 C700,185 730,225 740,200"
