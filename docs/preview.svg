<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <!-- Aurora curtain gradients -->
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0" />
      <stop offset="30%" stop-color="#00ff88" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00e5a0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#00aaff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aurora3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0" />
      <stop offset="35%" stop-color="#00aaff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#7c52ff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aurora4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff44ff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ff44ff" stop-opacity="0.20" />
      <stop offset="75%" stop-color="#7c52ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff44ff" stop-opacity="0" />
    </linearGradient>
    <!-- Mountain gradient -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030209" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#010003" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Background -->
