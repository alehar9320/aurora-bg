    <rect x="640" y="75" width="2" height="265" fill="#00e5ff" rx="1" />
  </g>

  <!-- Mountain silhouettes (back layer) -->
  <path d="M0,360 L20,340 L45,355 L70,310 L95,330 L120,295 L150,315 L180,275 L210,300 L240,260 L270,285 L300,245 L330,270 L360,230 L390,255 L420,220 L450,250 L480,210 L510,240 L540,200 L570,230 L600,195 L630,225 L660,185 L690,215 L720,200 L720,400 L0,400 Z"
        fill="#030209" opacity="0.85" />

  <!-- Mountain silhouettes (front layer) -->
  <path d="M0,390 L30,370 L60,385 L90,355 L120,375 L150,340 L180,360 L210,325 L240,350 L270,315 L300,340 L330,305 L360,330 L390,295 L420,320 L450,285 L480,310 L510,280 L540,305 L570,270 L600,295 L630,265 L660,290 L690,260 L720,280 L720,400 L0,400 Z"
