    <circle cx="620" cy="38" r="0.9" opacity="0.4" />
    <circle cx="690" cy="30" r="0.7" opacity="0.3" />
    <circle cx="80" cy="80" r="0.6" opacity="0.25" />
    <circle cx="160" cy="95" r="1.0" opacity="0.5" />
    <circle cx="230" cy="72" r="0.5" opacity="0.2" />
    <circle cx="310" cy="88" r="0.8" opacity="0.35" />
    <circle cx="380" cy="65" r="1.1" opacity="0.5" />
    <circle cx="460" cy="90" r="0.7" opacity="0.3" />
    <circle cx="530" cy="78" r="0.9" opacity="0.4" />
    <circle cx="600" cy="85" r="0.6" opacity="0.25" />
