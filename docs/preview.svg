    <circle cx="450" cy="155" r="0.8" opacity="0.35" />
    <circle cx="520" cy="145" r="1.1" opacity="0.5" />
    <circle cx="590" cy="165" r="0.5" opacity="0.2" />
    <circle cx="660" cy="130" r="0.9" opacity="0.4" />
