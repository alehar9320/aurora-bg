<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora BG — Live Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/aurora-bg/dist/aurora.umd.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0a0a1a; font-family: system-ui, sans-serif; }
    aurora-bg { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .overlay h1 {
      color: rgba(255,255,255,0.15);
      font-size: clamp(2rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-align: center;
    }
  </style>
</head>
<body>
  <aurora-bg
    colors="#00ff88,#00aaff,#ff44ff"
    density="0.7"
    speed="0.8"
    interactive
  ></aurora-bg>
  <div class="overlay">
    <h1>Aurora BG</h1>
  </div>
  <script>auroraBg.defineAuroraBg()</script>
</body>
</html>
